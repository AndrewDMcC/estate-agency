app = "jfea-estate-agency"
primary_region = "lhr"

[build]

[env]
  DATA_DIR = "/data"
  SEED_DEMO = "false"
  RIGHTMOVE_MODE = "dryrun"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
